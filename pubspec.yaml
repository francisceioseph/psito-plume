name: psito_plume
description: "A little paint program with cockatiels. No ads, no telemetry, no account."
publish_to: 'none'
version: 1.10.0

environment:
  sdk: ^3.13.3

dependencies:
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mascot/
    - assets/stamps/
    - assets/brushes/
  fonts:
    - family: CardSerif
      fonts:
        - asset: assets/fonts/CardSerif-Bold.ttf
    - family: PlumeSans
      fonts:
        - asset: assets/fonts/PlumeSans-Regular.ttf
